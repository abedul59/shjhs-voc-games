  <path d="M388 225Q451 248 470 298T538 355Q510 380 555 421T577 503Q558 530 590 566" fill="none" stroke="#e0c58d" stroke-width="5" stroke-dasharray="3 15" opacity=".75"/>
  <path d="M154 338Q225 362 272 444T366 518M213 272Q285 293 318 341" fill="none" stroke="#638e91" stroke-width="6" opacity=".7"/>
  <path class="land" fill="url(#heaven)" d="M683 143 L709 111 739 114 768 79 803 86 821 110 856 112 862 143 837 167 800 175 777 194 745 182 717 194 689 170Z"/>
  <path d="M702 158Q758 125 843 148" fill="none" stroke="#fff6d9" stroke-width="8" opacity=".55"/>
  <path class="land" fill="url(#demon)" d="M856 214 L883 193 915 203 941 181 972 197 1000 184 1043 209 1066 198 1098 227 1128 245 1122 278 1145 306 1118 338 1139 374 1119 405 1127 437 1096 460 1068 453 1040 485 1010 472 976 497 942 477 907 484 890 455 859 450 841 411 810 396 822 356 798 324 820 286 811 254Z"/>
  <g fill="none" stroke="#d3b48b" stroke-width="5" opacity=".35"><path d="M856 252Q947 293 1119 268"/><path d="M831 337Q945 367 1125 343"/><path d="M863 422Q985 389 1096 446"/></g>
  <path class="land" fill="url(#millis)" d="M825 535 L867 517 898 526 931 514 960 525 1006 527 1043 548 1078 546 1095 575 1079 612 1090 641 1066 667 1052 709 1004 724 963 714 922 736 879 715 843 725 819 697 791 684 788 651 768 627 783 593 775 564Z"/>
  <path d="M804 570Q846 615 874 691M845 552Q890 609 915 707" fill="none" stroke="#4e8265" stroke-width="23" opacity=".45"/>
