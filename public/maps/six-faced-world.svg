  <path d="M307 676Q414 669 587 703M351 731Q477 694 579 741" fill="none" stroke="#ead8af" stroke-width="5" opacity=".45"/>
  <path d="M725 570l20-21 22 13-6 27-25 8zM720 604l10-7 15 11-4 17-16-3z" fill="#8b9b73" stroke="#ede0b7" stroke-width="3"/>
  <text class="sea" x="721" y="445">林古斯海</text>
  <text class="cont" x="300" y="213">中央大陸</text>
  <text class="cont" x="774" y="128">天大陸</text>
  <text class="cont" x="973" y="279">魔大陸</text>
  <text class="cont" x="939" y="577">米里斯大陸</text>
  <text class="cont" x="439" y="689">貝卡利特大陸</text>
  <g class="place"><circle cx="155" cy="283" r="5"/><text x="155" y="305">劍之聖地</text><circle cx="300" cy="265" r="5"/><text x="300" y="288">拉諾亞王國</text><circle cx="404" cy="205" r="5"/><text x="404" y="227">巴謝蘭特王國</text><circle cx="494" cy="261" r="5"/><text x="494" y="285">內利斯王國</text><circle cx="348" cy="326" r="5"/><text x="348" y="349">魔法都市夏利亞</text><circle cx="189" cy="389" r="5"/><text x="189" y="412">阿斯拉王國</text><circle cx="247" cy="471" r="5"/><text x="247" y="494">菲托亞領</text><circle cx="519" cy="458" r="5"/><text x="519" y="481">紛爭地帶</text><circle cx="517" cy="560" r="5"/><text x="517" y="583">王龍王國</text><circle cx="405" cy="544" r="5"/><text x="405" y="565">西隆王國</text><circle cx="579" cy="349" r="5"/><text x="579" y="370">赤龍山脈</text></g>
  <g class="place"><circle cx="907" cy="335" r="5"/><text x="907" y="359">利卡里斯城</text><circle cx="1037" cy="323" r="5"/><text x="1037" y="347">奇希莉卡城</text><circle cx="1090" cy="417" r="5"/><text x="1090" y="440">溫恩港</text><circle cx="878" cy="636" r="5"/><text x="878" y="658">大森林</text><circle cx="994" cy="626" r="5"/><text x="994" y="648">米里斯神聖國</text><circle cx="975" cy="693" r="5"/><text x="975" y="715">米里希昂</text><circle cx="816" cy="578" r="5"/><text x="816" y="600">西港</text></g>
  <g class="site"><text x="502" y="715">迷宮都市拉潘</text><text x="545" y="751">✦ 轉移迷宮</text><text x="738" y="645">鬼之島</text><text x="769" y="164">天族高地</text></g>
  <rect x="22" y="20" width="401" height="52" rx="8" fill="#112b35" fill-opacity=".85" stroke="#e4cb95" stroke-width="2"/>
  <text x="40" y="55" font-family="Georgia,'Noto Serif TC',serif" font-size="25" font-weight="bold" fill="#f5e5bc">THE SIX-FACED WORLD</text>
  <text x="1168" y="776" text-anchor="end" font-family="Georgia,'Noto Serif TC',serif" font-size="13" fill="#e8d7ae">公開地理資料重繪示意 · 非官方精確海岸線</text>
</svg>
