<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">六面世界五大陸圖誌</title>
  <desc id="description">依公開地理描述自行繪製的示意圖，標示中央、魔、米里斯、貝卡利特與天大陸，以及主要王國、城市和迷宮；海岸線非官方精確測繪。</desc>
  <defs>
    <radialGradient id="ocean"><stop stop-color="#406a72"/><stop offset="1" stop-color="#132b3b"/></radialGradient>
    <linearGradient id="central" x2=".7" y2="1"><stop stop-color="#cbd3af"/><stop offset=".48" stop-color="#aab98d"/><stop offset="1" stop-color="#777c58"/></linearGradient>
    <linearGradient id="demon" x2="1" y2="1"><stop stop-color="#b59a78"/><stop offset="1" stop-color="#765e58"/></linearGradient>
    <linearGradient id="millis" x2="1" y2="1"><stop stop-color="#9dbb8d"/><stop offset="1" stop-color="#547760"/></linearGradient>
    <linearGradient id="begaritt" x2="1" y2="1"><stop stop-color="#d9c69d"/><stop offset="1" stop-color="#ae8a61"/></linearGradient>
    <linearGradient id="heaven" x2=".3" y2="1"><stop stop-color="#e6e9d9"/><stop offset="1" stop-color="#a6b8b4"/></linearGradient>
    <pattern id="waves" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M0 25q12-7 23 0t23 0" fill="none" stroke="#c5d8ce" stroke-opacity=".13" stroke-width="2"/></pattern>
    <filter id="shadow"><feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#071a21" flood-opacity=".65"/></filter>
    <style>
      .land{stroke:#efe4bd;stroke-width:4;stroke-linejoin:round;filter:url(#shadow)}
      .cont{font:700 27px Georgia,'Noto Serif TC',serif;letter-spacing:2px;fill:#fff2d2;paint-order:stroke;stroke:#21353b;stroke-width:6;stroke-linejoin:round;text-anchor:middle}
      .place{font:700 15px Georgia,'Noto Serif TC',serif;fill:#fff1d4;paint-order:stroke;stroke:#172d31;stroke-width:4;stroke-linejoin:round;text-anchor:middle}
      .place circle{fill:#f1d293;stroke:#3f3f35;stroke-width:2}
      .site{font:700 14px Georgia,'Noto Serif TC',serif;fill:#ffdfa8;paint-order:stroke;stroke:#26323a;stroke-width:4;text-anchor:middle}
      .sea{font:italic 22px Georgia,'Noto Serif TC',serif;fill:#d3ddd0;opacity:.85;letter-spacing:5px;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="url(#ocean)"/>
  <rect width="1200" height="800" fill="url(#waves)"/>
