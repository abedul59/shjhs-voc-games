  <title id="title">六域鍊金大陸</title>
  <desc id="desc">依優米雅的鍊金工房世界地圖由西向東的長形破碎陸帶構圖，重新描繪森林、峽谷、菌域、工業廢墟與圓形遺跡的海岸外緣。</desc>
